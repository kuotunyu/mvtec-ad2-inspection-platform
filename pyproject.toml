[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mvtec-ad2-inspection-platform"
version = "0.1.0"
description = "Reproducible MVTec AD 2 benchmarking and industrial inspection workstation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "truststore>=0.10.4,<0.11",
]

[project.optional-dependencies]
ml = [
  "anomalib==2.5.0",
  "numpy>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "tifffile>=2025,<2027",
]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "numpy>=2.2,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "tifffile>=2025,<2027",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspection_platform", "experiments"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "dataset: requires the verified external MVTec AD 2 dataset",
  "gpu: requires an explicitly acquired compatible GPU lease",
  "slow: takes substantially longer than the default local test suite",
]

[tool.coverage.run]
branch = true
source = ["inspection_platform"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
exclude = ["docs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["inspection_platform", "experiments"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
