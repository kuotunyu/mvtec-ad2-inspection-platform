<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Inspection evidence workflow</title><desc id="desc">A batch moves through validation, verified inference, pass or review routing, human disposition, and hashed reports.</desc><rect width="1200" height="360" fill="#071218"/><text x="60" y="64" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#e9f5f7">Batch-to-review evidence workflow</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#13242c" stroke="#35d3e1" stroke-width="3"><rect x="45" y="135" width="175" height="100" rx="15"/><rect x="280" y="135" width="175" height="100" rx="15"/><rect x="515" y="135" width="175" height="100" rx="15"/><rect x="750" y="135" width="175" height="100" rx="15"/><rect x="985" y="135" width="175" height="100" rx="15"/></g><g fill="#e9f5f7" font-size="18" font-weight="700"><text x="132" y="181">Upload batch</text><text x="367" y="181">Decode + hash</text><text x="602" y="181">Verified inference</text><text x="837" y="181">PASS / REVIEW</text><text x="1072" y="181">Human + report</text></g><g fill="#87a2ad" font-size="13"><text x="132" y="207">local storage</text><text x="367" y="207">partial success</text><text x="602" y="207">leased worker</text><text x="837" y="207">model evidence</text><text x="1072" y="207">audited revision</text></g></g><g stroke="#f0ad2f" stroke-width="4"><path d="M220 185h60M455 185h60M690 185h60M925 185h60"/></g><text x="600" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#f0ad2f">No automatic final rejection · no defect-type claim</text></svg>
