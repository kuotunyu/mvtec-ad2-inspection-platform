<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Inspection platform architecture</title><desc id="desc">A React workstation calls a FastAPI service backed by SQLite and an artifact store. A leased worker verifies a model registry and produces evidence.</desc><rect width="1200" height="520" fill="#071218"/><g font-family="Arial,sans-serif" fill="#dce8ec"><text x="60" y="70" font-size="30" font-weight="700">MVTec AD 2 inspection architecture</text><text x="60" y="104" font-size="16" fill="#87a2ad">Local-first · evidence-led · fail-closed</text></g><g stroke="#35d3e1" stroke-width="3" fill="#13242c"><rect x="60" y="170" width="210" height="150" rx="16"/><rect x="365" y="170" width="210" height="150" rx="16"/><rect x="670" y="170" width="210" height="150" rx="16"/><rect x="975" y="170" width="165" height="150" rx="16"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#e9f5f7"><text x="165" y="222" font-size="22" font-weight="700">React workstation</text><text x="165" y="258" font-size="15">submit · inspect · review</text><text x="470" y="222" font-size="22" font-weight="700">FastAPI</text><text x="470" y="258" font-size="15">validate · persist · report</text><text x="775" y="222" font-size="22" font-weight="700">Leased worker</text><text x="775" y="258" font-size="15">verify · infer · resume</text><text x="1057" y="222" font-size="22" font-weight="700">Registry</text><text x="1057" y="258" font-size="15">hash-locked bundles</text></g><g stroke="#f0ad2f" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M270 245h80"/><path d="M575 245h80"/><path d="M880 245h80"/></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f0ad2f"/></marker></defs><g fill="#13242c" stroke="#49636e" stroke-width="2"><rect x="365" y="380" width="210" height="80" rx="14"/><rect x="670" y="380" width="210" height="80" rx="14"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#dce8ec"><text x="470" y="414" font-size="18" font-weight="700">SQLite WAL</text><text x="470" y="440" font-size="14">jobs · reviews · audit</text><text x="775" y="414" font-size="18" font-weight="700">Artifact store</text><text x="775" y="440" font-size="14">content-addressed · external</text></g><path d="M470 320v60M775 320v60" stroke="#49636e" stroke-width="3"/></svg>
